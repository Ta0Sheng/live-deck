<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播互动台</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --fish: #ffb86b; --ok: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  /* 内容区可以选中复制；顶栏和按钮保持不可选（2026-10-22 用户要求） */
  .feed, #feed-fish, .feed *, #feed-fish * { user-select: text; -webkit-user-select: text; }
  .feed button, #feed-fish button, header, header * { user-select: none; -webkit-user-select: none; }
  .feed, #feed-fish { cursor: text; }
  ::selection { background: rgba(31,111,235,.45); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.55 "Microsoft YaHei UI", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { font-weight: 600; letter-spacing: .5px; color: var(--accent); }
  .brand small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .demo-badge {
    font-size: 11px; color: #ffd479; border: 1px solid #6b5a2b;
    background: #2b2416; padding: 2px 9px; border-radius: 10px;
  }
  input.room {
    width: 130px; padding: 5px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: #0d1117; color: var(--fg);
    font: inherit; outline: none;
  }
  input.room:focus { border-color: var(--accent); }
  button {
    padding: 5px 13px; border-radius: 6px; border: 1px solid var(--line);
    background: #21262d; color: var(--fg); font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover { background: #388bfd; }
  button.danger { border-color: #6b2b2b; color: #ff9c9c; }
  button.danger:hover { background: #3d1d1d; border-color: #b33; }
  button.mode { font-weight: 600; min-width: 76px; }
  button.mode.draft { border-color: #6b5a2b; color: #ffd479; background: #2b2416; }
  button.mode.live { border-color: #b33; color: #fff; background: #b3242a; }
  .meta { margin-left: auto; color: var(--dim); font-size: 12px; display: flex; gap: 14px; }
  .wallet { color: #e3b341; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 2px; }
  button.recharge { border-color: #6b5a2b; color: #ffd479; padding: 4px 11px; }
  button.recharge:hover { background: #2b2416; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #484f58; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.off { background: var(--bad); }

  main { flex: 1; display: grid; grid-template-columns: 1.1fr 0.95fr 0.95fr 1.1fr; gap: 1px; background: var(--line); min-height: 0; }
  section { background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  section h2 {
    margin: 0; padding: 7px 12px; font-size: 12px; font-weight: 600;
    color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex: none;
  }
  section h2 .n { margin-left: auto; font-weight: 400; color: #484f58; font-variant-numeric: tabular-nums; }
  .feed { flex: 1; overflow-y: auto; padding: 4px 0; scrollbar-width: thin; }
  .feed::-webkit-scrollbar { width: 7px; }
  .feed::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  .dm { padding: 3px 12px; display: flex; gap: 7px; }
  .dm .u { color: var(--accent); flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dm .x { word-break: break-all; color: #c9d1d9; }
  .dm.fish { background: rgba(255,184,107,.09); border-left: 2px solid var(--fish); padding-left: 10px; }
  .dm.fish .u { color: var(--fish); font-weight: 600; }
  .dm.fish .x { color: #ffd9a8; }
  .dm.sys { color: var(--dim); font-style: italic; }
  .dm.sys .x { color: var(--dim); }

  .sub { padding: 5px 12px; color: #d2d8de; border-bottom: 1px solid rgba(255,255,255,.03); }
  .sub.clean { color: #8ff0b4; background: rgba(80, 220, 140, .05); }
  .sub.clean::before { content: '精'; color: #3f8d63; font-size: 10px; margin-right: 5px; vertical-align: 1px; }
  .sub .ts { color: #484f58; margin-right: 7px; font-variant-numeric: tabular-nums; font-size: 11px; }

  .scene { padding: 10px; border-bottom: 1px solid var(--line); }
  .scene img { width: 100%; border-radius: 7px; display: block; background: #000; }
  .scene .d { margin-top: 7px; color: #e6edf3; }
  .scene .t { color: #484f58; font-size: 11px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .scene.fail .d { color: var(--bad); }
  .empty { color: #484f58; padding: 18px; text-align: center; }

  .fish-row { display: flex; gap: 8px; padding: 3px 12px; align-items: baseline; }
  .fish-row .ts { color: #484f58; font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  .fish-row .score { font-size: 10px; padding: 1px 6px; border-radius: 9px; margin-right: 7px; flex: none; font-variant-numeric: tabular-nums; }
  .fish-row .score.s5, .fish-row .score.s4 { background: rgba(63,185,80,.18); color: #7ee787; }
  .fish-row .score.s3 { background: rgba(210,153,34,.18); color: #e3b341; }
  .fish-row .score.s2, .fish-row .score.s1 { background: rgba(248,81,73,.18); color: #ff7b72; }
  .fish-row .rate { margin-left: 6px; padding: 0 7px; font-size: 11px; line-height: 17px; border-radius: 4px; background: #21262d; border: 1px solid #30363d; color: #8b949e; cursor: pointer; flex: none; }
  .fish-row .rate:hover { color: #fff; border-color: #6e7681; }
  .fish-row .rate.done { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .fish-row .k { flex: none; width: 46px; font-size: 11px; color: var(--dim); }
  .fish-row .x { word-break: break-all; flex: 1; min-width: 0; }
  .fish-row.preview .k { color: #6e7681; }
  .fish-row.preview .x { color: #8b949e; }
  .fish-row.draft { background: rgba(255,184,107,.08); }
  .fish-row.draft .k, .fish-row.draft .x { color: var(--fish); }
  .fish-row.sent .k { color: var(--ok); }
  .fish-row.sent .x { color: #3fb950; }
</style>
</head>
<body>
<header>
  <div class="brand">直播互动台<small>弹幕 · 字幕 · 鱼</small></div>
  <span id="demo-badge" class="demo-badge" hidden title="演示模式：不连 B站，数据是脚本喂的">演示数据</span>
  <input id="room" class="room" placeholder="房间号" inputmode="numeric">
  <button id="go" class="primary">进入</button>
  <button id="out">退出房间</button>
  <button id="mode" class="mode draft" title="草稿=只生成不发；公开=真的发到直播间">草稿</button>
  <button id="fishbtn" title="开关直播鱼">鱼 开</button>
  <button id="quit" class="danger" title="关掉服务器、字幕和鱼，整个程序退出">退出程序</button>
  <span id="wallet" class="wallet" title="B币余额（直播间叫「电池」，1 B币 = 1 元）">电池 --</span>
  <button id="recharge" class="recharge" title="打开 B站 充值页">充值</button>
  <div class="meta">
    <span><i id="d-dm" class="dot"></i>弹幕</span>
    <span><i id="d-asr" class="dot"></i>字幕</span>
    <span><i id="d-fish" class="dot"></i>鱼</span>
    <span id="roomlabel">未进入</span>
  </div>
</header>
<main>
  <section>
    <h2>鱼的草稿 <span class="n" id="n-fish">0</span></h2>
    <div class="feed" id="feed-fish"><div class="empty">还没有发言</div></div>
  </section>
  <section>
    <h2>弹幕 <span class="n" id="n-dm">0</span></h2>
    <div class="feed" id="feed-dm"><div class="empty">等待进入房间…</div></div>
  </section>
  <section>
    <h2>字幕 <span class="n" id="n-asr">0</span></h2>
    <div class="feed" id="feed-asr"><div class="empty">ASR 未开始</div></div>
  </section>
  <section>
    <h2>画面识别 <span class="n" id="n-sc">0</span></h2>
    <div class="feed" id="feed-sc"><div class="empty">还没有画面</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const MAX = 220;
let counts = { dm: 0, asr: 0, sc: 0 };

function push(feedId, el, max = MAX) {
  const feed = $(feedId);
  feed.querySelector('.empty')?.remove();
  feed.appendChild(el);
  while (feed.children.length > max) feed.firstElementChild.remove();
  feed.scrollTop = feed.scrollHeight;
}

function time(ts) {
  const d = new Date((ts || Date.now() / 1000) * 1000);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

function addDanmaku(ev) {
  const row = document.createElement('div');
  row.className = 'dm' + (ev.toFish ? ' fish' : '');
  const u = document.createElement('span');
  u.className = 'u'; u.textContent = ev.user;
  const x = document.createElement('span');
  x.className = 'x'; x.textContent = ev.text;
  row.append(u, x);
  push('feed-dm', row);
  counts.dm++; $('n-dm').textContent = counts.dm;
}

function addSub(ev) {
  const row = document.createElement('div');
  row.className = 'sub' + (ev.clean ? ' clean' : '');
  const t = document.createElement('span');
  t.className = 'ts'; t.textContent = ev.time || '';
  const x = document.createElement('span');
  x.textContent = ev.text;
  row.append(t, x);
  if (ev.clean && ev.raw && ev.raw !== ev.text) row.title = '识别原文：' + ev.raw;
  push('feed-asr', row);
  counts.asr++; $('n-asr').textContent = counts.asr;
}

function addScene(ev) {
  const box = document.createElement('div');
  box.className = 'scene' + (ev.fail ? ' fail' : '');
  if (ev.img) {
    const img = document.createElement('img');
    img.src = ev.img;
    box.appendChild(img);
  }
  const d = document.createElement('div');
  d.className = 'd'; d.textContent = ev.desc || '';
  const t = document.createElement('div');
  t.className = 't'; t.textContent = time(ev.ts);
  box.append(d, t);
  const feed = $('feed-sc');
  feed.querySelector('.empty')?.remove();
  feed.prepend(box);
  while (feed.children.length > 40) feed.lastElementChild.remove();
  feed.scrollTop = 0;
  counts.sc++; $('n-sc').textContent = counts.sc;
}

function addFish(ev) {
  const row = document.createElement('div');
  row.className = 'fish-row ' + (ev.kind || '');
  const t = document.createElement('span');
  t.className = 'ts'; t.textContent = ev.time || '';
  // 分数从 "[3/5] 句子" 里拆出来，做成一个小徽标
  let body = ev.text || '';
  let score = null;
  const m = body.match(/^\[(\d)\/5\]\s*(.*)$/);
  if (m) { score = Number(m[1]); body = m[2]; }
  const k = document.createElement('span');
  k.className = 'k';
  k.textContent = ev.kind === 'preview' ? '准备发' : ev.kind === 'draft' ? '草稿' : '已发';
  row.append(t, k);
  if (score !== null) {
    const b = document.createElement('span');
    b.className = 'score s' + score;
    b.textContent = score + '/5';
    b.title = '像人度：1=一眼机器人，5=很像真人';
    row.appendChild(b);
  }
  const x = document.createElement('span');
  x.className = 'x'; x.textContent = body;
  row.append(x);
  // 2026-10-22：三键（本人定的）——
  //   ✔  = 两个都对（语境合适 + 说话像人）
  //   ✘人 = 说话方式不像人（主要错误）
  //   ✘景 = 语境不对（这个场面不该开口，犯得少）
  // 负例分开记，正面合在一起：省点击，又不让两条学习线互相污染。
  {
    const specs = [
      ['✔', 'ok', '两个都对：这个场面该接，而且说得像人'],
      ['✘人', 'human_bad', '说话方式不像人（机器味、太端着、不像群友）'],
      ['✘景', 'ctx_bad', '语境不对：这个场面不该开口'],
    ];
    for (const [label, verdict, title] of specs) {
      const b = document.createElement('button');
      b.className = 'rate';
      b.textContent = label;
      b.title = title;
      b.onclick = async () => {
        b.disabled = true;
        try {
          await post('/api/rate', { text: body, verdict });
          b.classList.add('done');
        } catch (e) {
          b.disabled = false;
          addSys('打分失败：' + e.message);
        }
      };
      row.append(b);
    }
  }
  push('feed-fish', row, 80);
  counts.fish = (counts.fish || 0) + 1;
  $('n-fish').textContent = counts.fish;
}

function addSys(text) {  const row = document.createElement('div');
  row.className = 'dm sys';
  const x = document.createElement('span');
  x.className = 'x'; x.textContent = text;
  row.appendChild(x);
  push('feed-dm', row);
}

let st = { mode: 'draft', fish: false };

function setMode(m) {
  st.mode = m === 'live' ? 'live' : 'draft';
  const b = $('mode');
  b.className = 'mode ' + st.mode;
  b.textContent = st.mode === 'live' ? '公开（真发）' : '草稿（不发）';
}

function setRoom(ev) {
  // hello/state 把房间包在 room 字段里；room/status 事件是扁平结构
  const r = (ev && typeof ev.room === 'object' && ev.room) ? ev.room : ev;
  const live = r.live ? '直播中' : '未开播';
  $('roomlabel').textContent = r.room ? `${r.room} · ${r.uname || ''} · ${live}` : '未进入';
  $('d-dm').className = 'dot ' + (r.danmaku ? 'on' : 'off');
  $('d-asr').className = 'dot ' + (r.asr ? 'on' : 'off');
  if (typeof r.fish === 'boolean') {
    st.fish = r.fish;
    $('d-fish').className = 'dot ' + (r.fish ? 'on' : 'off');
    $('fishbtn').textContent = r.fish ? '鱼 开' : '鱼 关';
  }
  if (r.mode) setMode(r.mode);
  if (ev.mode) setMode(ev.mode);
  if (r.demo || ev.demo) {
    $('demo-badge').hidden = false;
    $('mode').disabled = true;
    $('mode').title = '演示模式：发送能力是关的';
  }
  if (r.title) document.title = `${r.title} · 直播互动台`;
}

function handle(ev) {
  switch (ev.t) {
    case 'hello':
    case 'room':
    case 'status':
      setRoom(ev);
      break;
    case 'mode': setMode(ev.mode); break;
    case 'danmaku': addDanmaku(ev); break;
    case 'enter': addSys(`${ev.user} 进入直播间`); break;
    case 'asr': addSub(ev); break;
    case 'scene': addScene(ev); break;
    case 'fish': addFish(ev); break;
  }
}

let ws, retry = 0;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retry = 0; };
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose = () => {
    $('d-dm').className = 'dot off'; $('d-asr').className = 'dot off';
    retry = Math.min(retry + 1, 6);
    setTimeout(connect, 500 * retry);
  };
}
connect();

async function enter() {
  const room = $('room').value.trim();
  if (!/^\d+$/.test(room)) { $('room').focus(); return; }
  $('go').disabled = true;
  try {
    const r = await fetch('/api/enter', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room }),
    });
    const j = await r.json();
    if (!j.ok) addSys(j.error || '进入失败');
    else {
      // 2026-10-22：换房间后服务端会把模式重置成「草稿」，按钮要跟着变，
      // 否则界面写着「公开（真发）」、实际是草稿，容易误判。
      if (j.mode) setMode(j.mode);
      for (const id of ['feed-dm', 'feed-asr', 'feed-sc', 'feed-fish']) {
        $(id).innerHTML = '';
      }
      counts = { dm: 0, asr: 0, sc: 0, fish: 0 };
      $('n-dm').textContent = $('n-asr').textContent = $('n-sc').textContent = $('n-fish').textContent = '0';
    }
  } catch (e) {
    addSys('请求失败：' + e.message);
  } finally {
    $('go').disabled = false;
  }
}

async function loadWallet() {
  try {
    const r = await fetch('/api/wallet');
    const j = await r.json();
    const el = $('wallet');
    if (j.ok) {
      el.textContent = '电池 ' + Number(j.battery || 0).toFixed(2);
      el.style.color = Number(j.battery) > 0 ? '#e3b341' : '#8b949e';
      el.title = '金瓜子 ' + (j.gold || 0) + '（100 金瓜子 = 1 电池）';
    } else {
      el.textContent = '电池 --';
      el.title = '查不到余额：' + (j.error || '未登录？');
    }
  } catch (_) {}
}
loadWallet();
setInterval(loadWallet, 60000);

$('recharge').onclick = async () => {
  // 先试程序自己的窗口（不经过 Edge）
  try {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_recharge) {
      await window.pywebview.api.open_recharge();
      return;
    }
  } catch (e) { addSys('程序内打开失败：' + e.message); }
  try { await post('/api/open-url', { url: 'https://link.bilibili.com/p/center/index#/user-center/my-info/operation' }); }
  catch (e) { addSys('打开充值页失败：' + e.message); }
};
$('go').onclick = enter;
$('room').onkeydown = e => { if (e.key === 'Enter') enter(); };

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

$('mode').onclick = async () => {
  const next = st.mode === 'live' ? 'draft' : 'live';
  if (next === 'live' && !confirm('切到【公开模式】？\n直播鱼会真的把弹幕发到这个直播间。')) return;
  try {
    const j = await post('/api/mode', { mode: next });
    if (j.ok) { setMode(j.mode); addSys(next === 'live' ? '已切到公开模式：真发' : '已切到草稿模式：只生成不发'); }
  } catch (e) { addSys('切换失败：' + e.message); }
};

$('fishbtn').onclick = async () => {
  const on = !st.fish;
  if (!on && !confirm('关掉直播鱼？它会停止生成草稿。')) return;
  try {
    const j = await post('/api/fish', { on });
    if (j.ok) {
      st.fish = j.fish;
      $('d-fish').className = 'dot ' + (j.fish ? 'on' : 'off');
      $('fishbtn').textContent = j.fish ? '鱼 开' : '鱼 关';
    }
  } catch (e) { addSys('操作失败：' + e.message); }
};

$('quit').onclick = async () => {
  if (!confirm('退出整个程序？\n字幕、弹幕和直播鱼都会停。')) return;
  try { await post('/api/quit'); } catch (_) {}
  document.body.innerHTML = '<div style="padding:48px;color:#8b949e;font:14px system-ui">程序已退出，这个窗口可以关了。</div>';
};
$('out').onclick = async () => {
  await fetch('/api/leave', { method: 'POST' });
  $('roomlabel').textContent = '未进入';
  $('d-dm').className = 'dot'; $('d-asr').className = 'dot';
};
</script>
</body>
</html>
